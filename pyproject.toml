[project]
name = "tg-psyco"
version = "0.1.0"
description = "Telegram bot for a Russian psychological dictionary"
authors = [
    {name = "denver",email = "denis.gubich@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31,<4.0",
    "aiohttp>=3.13,<4.0",
    "rapidfuzz>=3.14,<4.0",
]

[project.scripts]
tg-psyco = "app.main:main"
tg-psyco-import = "app.db.import_dictionary:main"

[tool.poetry]
packages = [{ include = "app" }]
include = ["app/db/schema.sql"]

[tool.poetry.group.dev.dependencies]
pytest = ">=9,<10"
pytest-asyncio = ">=1.2,<2"
ruff = ">=0.14,<1"
pdfplumber = ">=0.11,<1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
